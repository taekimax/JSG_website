name: Deploy website to Cafe24

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafe24-website
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.CAFE24_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '>=24.15.0 <25' # jsdom 30 requires Node 24.15.0 or newer.
          package-manager-cache: false
      - name: Install verification dependencies
        run: npm ci --ignore-scripts
      - name: Verify and stage public files
        run: |
          npm --ignore-scripts run verify
          node tools/stage-site.mjs
      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp
      - name: Publish website to Cafe24
        env:
          CAFE24_REMOTE_DIR: ${{ vars.CAFE24_REMOTE_DIR }}
          CAFE24_SFTP_HOST: ${{ secrets.CAFE24_SFTP_HOST }}
          CAFE24_SFTP_PORT: ${{ secrets.CAFE24_SFTP_PORT }}
          CAFE24_SFTP_USERNAME: ${{ secrets.CAFE24_SFTP_USERNAME }}
          CAFE24_SFTP_PASSWORD: ${{ secrets.CAFE24_SFTP_PASSWORD }}
          CAFE24_SFTP_KNOWN_HOSTS: ${{ secrets.CAFE24_SFTP_KNOWN_HOSTS }}
        run: |
          test "$CAFE24_REMOTE_DIR" = "/home/hosting_users/jinsungsc/www"
          test -n "$CAFE24_SFTP_HOST"
          test -n "$CAFE24_SFTP_PORT"
          test -n "$CAFE24_SFTP_USERNAME"
          test -n "$CAFE24_SFTP_PASSWORD"
          test -n "$CAFE24_SFTP_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$CAFE24_SFTP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          export LFTP_PASSWORD="$CAFE24_SFTP_PASSWORD"
          lftp --env-password --user "$CAFE24_SFTP_USERNAME" "sftp://$CAFE24_SFTP_HOST:$CAFE24_SFTP_PORT" -e "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 20;
            set sftp:connect-program ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts;
            mirror --reverse --verbose _site/ $CAFE24_REMOTE_DIR/;
            bye
          "
      - name: Verify published website
        run: |
          python3 - <<'PYVERIFY'
          import re
          from pathlib import Path
          from urllib.request import urlopen
          expected_headers = re.findall(
              r'^[ \t]*Header[ \t]+always[ \t]+set[ \t]+([\w-]+)[ \t]+"([^"\r\n]+)"[ \t]*$',
              Path('_site/.htaccess').read_text(encoding='utf-8'),
              re.MULTILINE,
          )
          assert expected_headers, 'No security headers found in staged .htaccess'
          for name in ['index.html', 'about.html', 'assets/shared/board-endpoints.json']:
              with urlopen('https://jsginvest.com/' + name, timeout=30) as response:
                  assert response.read() == Path('_site', name).read_bytes(), name
                  if name == 'about.html':
                      for header, expected in expected_headers:
                          actual = response.headers.get_all(header)
                          assert actual == [expected], f'{header}: expected {[expected]!r}, got {actual!r}'
                          print('Verified header:', header)
              print('Verified:', name)
          PYVERIFY
