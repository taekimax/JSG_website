<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSG Investment Inc.</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="logo">JSG Investment</a>
            <nav class="desktop-nav">
                <a href="about.html">About</a>
                <a href="team.html">Team</a>
                <a href="philosophy.html">Philosophy</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="notice.html">Notice</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="site-main site-main--interior">
        <div class="container content-shell">
            <section class="page-hero">
                <div class="page-hero-surface">
                    <div class="page-hero-media">
                        <img src="assets/contact/contact-hero.jpg" alt="Contact">
                    </div>
                    <div class="page-hero-text">
                        <p class="page-hero-kicker" id="contact-hero-kicker">Loading...</p>
                        <p class="page-hero-sub" id="contact-hero-lead">Loading...</p>
                    </div>
                </div>
            </section>

            <div class="contact-section">
                <h2 class="h2-title" id="contact-location-title">Loading...</h2>
                <div class="contact-card contact-card--location">
                    <div class="contact-row">
                        <p class="contact-value" id="contact-location-address">Loading...</p>
                        <p class="contact-subtext" id="contact-location-subtext">Loading...</p>
                    </div>
                    <figure class="contact-map-frame">
                        <img id="contact-map-image" src="assets/contact/contact-map-placeholder.svg" alt="대치동 위치 안내 이미지">
                        <figcaption class="contact-map-caption" id="contact-map-caption">Loading...</figcaption>
                    </figure>
                </div>
            </div>

            <div class="contact-section">
                <h2 class="h2-title" id="contact-title">Loading...</h2>

                <div class="contact-card">
                    <div class="contact-row">
                        <span class="contact-label" id="contact-phone-label">Loading...</span>
                        <span class="contact-value" id="contact-phone-value">Loading...</span>
                    </div>

                    <div class="contact-row">
                        <span class="contact-label" id="contact-email-label">Loading...</span>
                        <span class="contact-value" id="contact-email-value">Loading...</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <nav class="bottom-nav section-pager">
        <a href="notice.html" class="nav-arrow">◀</a>
        <button id="sheet-toggle" class="nav-btn">Contact ▲</button>
        <a href="about.html" class="nav-arrow">▶</a>
    </nav>

    <div class="section-sheet">
        <ul class="sheet-list">
            <li><a href="about.html">About JSG</a></li>
            <li><a href="team.html">Team</a></li>
            <li><a href="philosophy.html">Philosophy</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="notice.html">Notice</a></li>
            <li><a href="contact.html" class="current">Contact</a></li>
        </ul>
    </div>

    <script src="scripts/ui.js"></script>
    <script src="scripts/assets.js"></script>
    <script src="scripts/contact.js"></script>
</body>

</html>
