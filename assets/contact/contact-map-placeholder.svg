    <text x="692" y="154" font-size="20" opacity="0.76">Teheran-ro 14-gil</text>
    <text x="730" y="548" font-size="22" opacity="0.82">Daechi-dong</text>
    <text x="694" y="352" font-size="28" font-weight="700">Samheung 2 Building</text>
