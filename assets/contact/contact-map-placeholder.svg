<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">JSG location placeholder map</title>
  <desc id="desc">Stylized map illustration highlighting Samheung 2 Building in Daechi-dong, Seoul.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0f1b2e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a3d2ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d8ecff" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#dcecff" stroke-width="1">
    <path d="M80 110H1120"/>
    <path d="M80 210H1120"/>
    <path d="M80 310H1120"/>
    <path d="M80 410H1120"/>
    <path d="M80 510H1120"/>
    <path d="M80 610H1120"/>
    <path d="M160 60V660"/>
    <path d="M320 60V660"/>
    <path d="M480 60V660"/>
    <path d="M640 60V660"/>
    <path d="M800 60V660"/>
    <path d="M960 60V660"/>
  </g>
  <g opacity="0.7">
    <path d="M90 522H1110" stroke="url(#road)" stroke-width="24" stroke-linecap="round"/>
    <path d="M640 82V650" stroke="url(#road)" stroke-width="18" stroke-linecap="round"/>
    <path d="M350 168L1030 168" stroke="#f7d79d" stroke-opacity="0.7" stroke-width="8" stroke-linecap="round"/>
    <path d="M440 650L930 140" stroke="#89b7ff" stroke-opacity="0.48" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g opacity="0.4">
    <rect x="168" y="118" width="110" height="62" rx="14" fill="#12253e"/>
    <rect x="292" y="252" width="132" height="92" rx="18" fill="#162a46"/>
    <rect x="812" y="242" width="154" height="110" rx="20" fill="#11233a"/>
    <rect x="850" y="458" width="126" height="84" rx="18" fill="#152740"/>
    <rect x="198" y="452" width="152" height="118" rx="18" fill="#102238"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="640" cy="402" r="62" fill="#f3c97b" fill-opacity="0.18"/>
    <circle cx="640" cy="402" r="24" fill="#f8d698"/>
  </g>
  <g transform="translate(640 402)">
    <path d="M0-64C39-64 70-33 70 6C70 52 18 92 0 124C-18 92 -70 52 -70 6C-70-33 -39-64 0-64Z" fill="#f5d595"/>
    <circle cx="0" cy="4" r="22" fill="#0c1526"/>
