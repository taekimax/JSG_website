<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">JSG 위치 — 도로와 타이포그래피</title>
  <desc id="desc">로고처럼 왼쪽의 사이안과 오른쪽의 블루 색면을 흰색 테헤란로와 영동대로가 나누는 사각형 추상 약도. 삼성역은 오른쪽 끝에서 가로 1/3 지점의 교차점 중앙, JSG는 현대백화점 건너편과 섬유센터 왼쪽에 있다. 도심공항터미널은 현대백화점 위쪽과 코엑스 왼쪽에 있다. 현대차는 영동대로 오른쪽의 코엑스 맞은편에 있다. 글라스타워는 교차점 왼쪽 아래, 파크 하얏트 서울은 오른쪽 아래에 있다.</desc>
  <style>
    @font-face { font-family: Pretendard; src: url('../fonts/PretendardVariable.woff2') format('woff2'); font-weight: 100 900; }
    @font-face { font-family: JetBrainsMono; src: url('../fonts/JetBrainsMonoNerdFont-Regular.ttf') format('truetype'); font-weight: 400; }
    text { font-family: Pretendard, sans-serif; fill: #0f172a; font-size: 28px; font-weight: 550; text-anchor: middle; dominant-baseline: central; letter-spacing: -.8px; }
    .road-label { font-size: 22px; font-weight: 450; letter-spacing: 3px; }
  </style>
  <!-- Rectangular color fields echo the divided emblem; white roads form the cuts. -->
  <rect width="800" height="600" fill="#04f8fd"/>
  <path d="M481.655 0 H800 V600 H580.033 Z" fill="#1d4ed8"/>
  <path d="M-80 390 L880 240" fill="none" stroke="#ffffff" stroke-width="92"/>
  <path d="M464.088 -100 L594.088 640" fill="none" stroke="#ffffff" stroke-width="80"/>
  <text class="road-label" x="150" y="354" transform="rotate(-8.8807 150 354)">테헤란로</text>
  <text class="road-label" x="498" y="92" transform="rotate(-9.964 498 92)"><tspan x="498">영</tspan><tspan x="498" dy="28">동</tspan><tspan x="498" dy="28">대</tspan><tspan x="498" dy="28">로</tspan></text>
  <text x="383" y="89" transform="rotate(-8.8807 383 89)">코엑스</text>
  <text x="620" y="89" transform="rotate(-8.8807 620 89)" style="fill:#ffffff">현대차</text>
  <text x="190" y="113" transform="rotate(-8.8807 190 113)"><tspan x="190">도심공항</tspan><tspan x="190" dy="35">터미널</tspan></text>
  <text x="220" y="235" transform="rotate(-8.8807 220 235)">현대백화점</text>
  <text x="374" y="211" transform="rotate(-8.8807 374 211)">파르나스</text>
  <text x="533.333" y="294.167" transform="rotate(-8.8807 533.333 294.167)" style="font-weight:650;letter-spacing:-1.4px">삼성역</text>
  <!-- A static button-shaped location mark: white face, crisp Contact-navy shadow. -->
  <g id="jsg-location-mark">
    <rect x="124" y="427" width="124" height="62" rx="3" fill="#0f172a"/>
    <rect x="118" y="421" width="124" height="62" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <text x="180" y="452" style="font-family:JetBrainsMono,monospace;font-size:52px;font-weight:400;letter-spacing:0">JSG</text>
  </g>
  <text x="325" y="401" transform="rotate(-8.8807 325 401)">섬유센터</text>
  <text x="450" y="381" transform="rotate(-8.8807 450 381)"><tspan x="450">글라스</tspan><tspan x="450" dy="35">타워</tspan></text>
  <text x="672" y="360" transform="rotate(-8.8807 672 360)" style="fill:#ffffff"><tspan x="672">파크 하얏트</tspan><tspan x="672" dy="35">서울</tspan></text>
</svg>
